services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: football-manager-app
        container_name: football_app
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: football_manager
            DB_USERNAME: sail
            DB_PASSWORD: password
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - football_network

    mysql:
        image: mysql:8.0
        container_name: football_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: football_manager
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sail", "-ppassword"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - football_network

networks:
    football_network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
