services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: football-manager-app
        container_name: football_app
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-football_manager}
            DB_USERNAME: ${DB_USERNAME:-dbuser}
            DB_PASSWORD: ${DB_PASSWORD:-changeme}
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - football_network

    mysql:
        image: mysql:8.0
        container_name: football_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-football_manager}
            MYSQL_USER: ${DB_USERNAME:-dbuser}
            MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-dbuser}", "-p${DB_PASSWORD:-changeme}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - football_network

networks:
    football_network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
